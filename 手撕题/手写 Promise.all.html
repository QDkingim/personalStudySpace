<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手写 Promise.all</title>
</head>

<body>
  <script>
    function promiseAll(promises) {
      return new Promise((resolve, reject) => {
        // 如果传入的参数不是可迭代对象,直接抛出错误
        if (!Array.isArray(promises)) {
          return reject(new TypeError('Promise.all接收一个数组作为参数'))
        }

        let results = []
        let completed = 0

        // 如果promises数组为空,直接 resolve
        if (promises.length === 0) {
          resolve(results)
        }

        // 遍历每个promises
        promises.forEach((promises, index) => {
          // 确保每个项都是 promise
          Promise.resolve(promises).then(
            value => {
              results[index] = value // 存储结果
              completed++ // 计数
              if (completed === promises.length) {
                resolve(results) // 所以promise都完成时,resolve返回结果数组
              }
            },
            error => reject(error) // 如果有任何一个promise被拒绝,则立即reject
          )
        })

      })
    }
  </script>
</body>

</html>
